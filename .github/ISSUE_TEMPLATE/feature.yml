name: 기능 작업
description: 새 기능이나 개선 작업을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 해결하려는 문제와 기대 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 내용과 제외할 내용을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 검증 가능한 체크리스트로 작성해 주세요.
    validations:
      required: true
